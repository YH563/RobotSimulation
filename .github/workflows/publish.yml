name: publish

# 无密钥发布（Trusted Publishing / OIDC）：每次运行向 nuget.org 换取一个「1 小时有效、一次性」的临时 API key，
# 仓库里不保存任何长期凭据。
#
# 运行前需要一次性配置两处：
#   1) nuget.org → 点用户名 → Trusted Publishing → Add policy：
#        Repository Owner : YH563
#        Repository       : RobotSimulation
#        Workflow File    : publish.yml        <- 只写文件名，不要带 .github/workflows/ 路径，大小写不敏感
#        Environment      : 留空               <- 本 workflow 不使用 GitHub Actions environment
#        Policy owner     : 你的个人账号         Scope: Push，glob: RobotSimulation.*
#        （glob 覆盖三个包，也允许首次发布全新的 package ID）
#   2) 本仓库 Settings → Secrets and variables → Actions → New repository secret：
#        NUGET_USER = 你的 nuget.org 用户名（不是邮箱；不想用 secret 也可直接把它写进下面的 user:）
#
# 发布新版本：先改 Directory.Build.props 里的 <Version> 并提交（版本号只有这一个来源），打一个带注解的
# tag 并推送（注解正文就是 Release 说明，第一行会被当成 Release 标题），再到 Actions 页面 Run workflow。
# 一次运行做两件事：推三个包到 nuget.org（publish job），再按 tag 注解建 / 更新对应的 GitHub Release
# （release job，见文件末尾；它只拿到 contents: write，推包那步仍然只有 contents: read）。
on:
  workflow_dispatch:
  # 想改成「推 tag 自动发布」就取消下面注释。注意：部分平台的 OIDC ref claim 不接受 tag，
  # 若要启用请先用 nuget.org 策略验证一次。
  # push:
  #   tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # 允许 GitHub 为本次运行签发 OIDC token（Trusted Publishing 的前提）
      contents: read
    steps:
      - uses: actions/checkout@v4

      # 每次运行都先把自己「发布的是哪个提交」写进日志：手动触发时极易选错 ref，或误点
      # "Re-run all jobs"（那会固定重跑当初那个旧提交，而不是最新代码），这一步让这一点一眼可见。
      - name: Show what is being published
        run: |
          echo "ref    : $GITHUB_REF  ($GITHUB_REF_NAME)"
          echo "commit : $(git rev-parse HEAD)"
          git --no-pager log -1 --oneline --stat

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore RobotSimulation.sln

      - name: Build
        run: dotnet build RobotSimulation.sln -c Release --no-restore

      # 测试工程在 Tests/（旧位置 src/RobotSimulation.Tests/ 已废弃，sln 与本步骤同步）。
      #
      # BareWindowTests 用 Silk.NET 真开一个 GL 窗口并跑主循环（窗口关闭才返回），是本地目视 / 手工检查用的；
      # CI runner 没有显示设备，直接跑会失败或永不返回，所以这里按类名过滤，只跑无头用例。本地想看那个窗口：
      #   dotnet test Tests/RobotSimulation.Tests.csproj -c Release --filter FullyQualifiedName~BareWindowTests
      - name: Test
        run: dotnet test Tests/RobotSimulation.Tests.csproj -c Release --no-build --filter "FullyQualifiedName!~BareWindowTests"

      - name: Pack
        run: |
          # 宿主工程与测试工程都设了 IsPackable=false，这里按依赖顺序显式打包三个库。
          for p in src/Core/RobotSimulation.Core.csproj \
                   src/Robot/RobotSimulation.Robot.csproj \
                   src/OpenGL/RobotSimulation.OpenGL.csproj; do
            dotnet pack "$p" -c Release --no-build -o artifacts
          done
          ls -l artifacts

      # 换取临时 API key（有效期 1 小时，且一个 OIDC token 只能换一次），拿到后要尽快推送。
      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::NuGet/login 未返回临时 key，请核对本步骤的 id/outputs 名称与 nuget.org 上的 Trusted Publishing 策略。"
            exit 1
          fi
          # 依赖先行：Core -> Robot -> OpenGL；.snupkg 用同一把临时 key 推，nuget.org 会自动挂上符号。
          for p in Core Robot OpenGL; do
            dotnet nuget push "artifacts/RobotSimulation.$p.*.nupkg" \
              --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
            dotnet nuget push "artifacts/RobotSimulation.$p.*.snupkg" \
              --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

  # 包推成功后，按 tag 注解建 / 更新对应的 GitHub Release。单独一个 job 是为了最小权限：
  # contents: write 只给这里（建 / 改 Release 需要），推包那步仍然只有 contents: read + id-token: write。
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 读 tag 的注解正文要完整的 tag 对象，浅克隆拿不到

      - name: Show what is being released
        run: |
          echo "ref    : $GITHUB_REF  ($GITHUB_REF_NAME)"
          echo "commit : $(git rev-parse HEAD)"

      - name: Create or update the GitHub Release for this version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # 版本号唯一来源仍然是 Directory.Build.props（与 publish job 用的是同一个）
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)"
          if [ -z "$version" ]; then
            echo "::error::Directory.Build.props 里没读到 <Version>，无法确定要发布哪个 tag。"
            exit 1
          fi
          tag="v$version"
          echo "版本 $version -> tag $tag"

          # 沿用「先推 tag，再 Run workflow」的流程：tag 不在远端就直接报错，避免默默建出一个没有
          # 注解正文的 Release（下面的 --verify-tag 也会再挡一次）。
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::远端没有 tag $tag。请先 git tag -a $tag（注解正文写 Release 说明）并 git push origin $tag，或核对 Directory.Build.props 的 <Version>。"
            exit 1
          fi

          # tag 指向的提交与本次运行的提交不一致时只提醒、不阻断：出错重跑、或本次运行选了别的 ref
          # （例如 master 已经往前走了）都可能这样。
          tag_sha="$(git rev-parse "$tag^{}")"
          if [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "::warning::tag $tag 指向 $tag_sha，本次运行的是 $GITHUB_SHA，两者不同，请确认是否符合预期。"
          fi

          # 正文 = tag 注解去掉第一行（第一行当标题），与手工发布的排版保持一致。
          # 注意：轻量 tag 上没有注解，git 会把提交信息当正文读出来，所以先判类型，别静默用错东西。
          notes="$(mktemp)"
          args=()
          if [ "$(git cat-file -t "$tag")" = tag ]; then
            git tag -l --format='%(contents:body)' "$tag" >"$notes"
          fi
          if [ -s "$notes" ]; then
            args+=(--notes-file "$notes")
          else
            echo "::warning::tag $tag 不是带注解的 tag（或注解没有正文），改用 GitHub 自动生成的 release notes；想自己写排版请用 git tag -a $tag。"
            args+=(--generate-notes)
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag 已存在，更新标题与正文。"
            gh release edit "$tag" --title "RobotSimulation $version" "${args[@]}"
          else
            echo "Release $tag 不存在，创建。"
            gh release create "$tag" --title "RobotSimulation $version" --verify-tag "${args[@]}"
          fi

          # 收尾只打印一行摘要。字段名要挑 gh 稳定支持的：新版 gh 已经移除了 isLatest，
          # 写回去会让这一步（以及整个 job，这里 set -e）失败——可用字段列表见
          # `gh release view --help`，或从报错的 "Available fields" 里抄。
          gh release view "$tag" --json name,tagName,isDraft,isPrerelease,url \
            | jq -r '"\(.name)  \(.tagName)  draft=\(.isDraft)  prerelease=\(.isPrerelease)  \(.url)"'
